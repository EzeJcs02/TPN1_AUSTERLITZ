<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TP1 - Ubicacion en Google Maps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Ubicación</h1>

    <label for="nombre">Nombre Ubicación</label>
    <input type="text" id="nombre" placeholder="Nombre Ubicacion">

    <label for="lat">Latitud</label>
    <input type="text" id="lat" placeholder="Ej: 28.3537921">

    <label for="lng">Longitud</label>
    <input type="text" id="lng" placeholder="Ej: -81.5618197">

    <button id="btnAbrir" onclick="abrirUbicacion()">Abrir Ubicación</button>

    <p id="mensaje"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
